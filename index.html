<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pemantauan - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow: hidden; margin: 0; padding: 0; }
        @keyframes breathe { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(6, 182, 212, 0.4)); } 50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.8)); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
        @keyframes dash { to { stroke-dashoffset: -40; } }
        .glass-panel { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(16px); border: 1px solid rgba(6, 182, 212, 0.2); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05); }
        .input-glass { background: rgba(2, 6, 23, 0.6); border: 1px solid rgba(51, 65, 85, 0.6); transition: all 0.3s ease; }
        .input-glass:focus-within { border-color: rgba(6, 182, 212, 0.6); box-shadow: 0 0 15px rgba(6, 182, 212, 0.15); }
        .btn-glow:hover { box-shadow: 0 0 20px rgba(6, 182, 212, 0.4); transform: translateY(-1px); }
        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #020617 inset !important; -webkit-text-fill-color: white !important; }
        .spinner { border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="relative h-screen w-screen flex items-center justify-center text-slate-200">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900/50 via-slate-950/90 to-black z-0 pointer-events-none"></div>
    <div class="absolute inset-0 w-full h-full pointer-events-none z-0 opacity-40" id="pipeline-container">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <g stroke-width="2" fill="none" class="stroke-cyan-400">
                <path d="M -50,30% L 15%,30% L 15%,60% L 35%,60%" stroke-dasharray="4, 40" style="animation: dash 3s linear infinite;" />
                <path d="M 105%,70% L 85%,70% L 85%,40% L 65%,40%" stroke-dasharray="4, 40" style="animation: dash 4s linear infinite reverse;" />
            </g>
        </svg>
    </div>

    <main class="relative z-10 w-full max-w-[420px] px-6 sm:px-0 flex flex-col items-center">
        <div id="login-card" class="glass-panel w-full rounded-[28px] p-8 sm:p-10 flex flex-col gap-8 transition-transform duration-300">
            <div class="flex flex-col items-center text-center space-y-4">
                <div class="flex items-center justify-center w-14 h-14 rounded-full bg-cyan-950/50 border border-cyan-500/30" style="animation: breathe 4s ease-in-out infinite;">
                    <i data-feather="droplet" class="text-cyan-400 w-7 h-7"></i>
                </div>
                <div class="space-y-1">
                    <p class="text-[10px] tracking-[0.2em] text-cyan-400 uppercase font-semibold">Sistem Pemantauan Kerja Turap</p>
                    <h1 class="text-sm font-semibold text-slate-300 tracking-wider"><br>OPERASI</h1>
                    <h2 class="text-xl sm:text-2xl font-bold text-white tracking-wide mt-1">PORT DICKSON</h2>
                </div>
            </div>

            <div class="w-full flex flex-col items-center gap-1 border-t border-slate-700/50 pt-6 mt-2 relative">
                <div class="absolute -top-[10px] bg-slate-900 border border-slate-700 px-3 py-0.5 rounded-full flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
                    <span class="text-[10px] font-mono tracking-widest text-emerald-400">SYSTEM ONLINE</span>
                </div>
                <h3 class="text-lg font-semibold text-white tracking-wide mt-2">AUTHORIZED ACCESS</h3>
            </div>

            <form id="auth-form" class="w-full flex flex-col gap-5 mt-2" onsubmit="handleLogin(event)">
                <div id="error-message" class="hidden bg-rose-950/40 border border-rose-500/30 rounded-lg p-3 flex items-center gap-3 text-rose-300 text-sm">
                    <i data-feather="alert-circle" class="w-4 h-4 shrink-0"></i>
                    <span>Invalid credentials.</span>
                </div>

                <div class="relative group">
                    <div class="input-glass flex items-center rounded-xl overflow-hidden px-4 py-3 relative z-10">
                        <i data-feather="user" class="text-slate-400 w-5 h-5 mr-3 group-focus-within:text-cyan-400"></i>
                        <input type="text" id="username" placeholder="Username" required class="bg-transparent border-none outline-none w-full text-white placeholder-slate-500 text-sm font-medium">
                    </div>
                </div>

                <div class="relative group">
                    <div class="input-glass flex items-center rounded-xl overflow-hidden px-4 py-3 relative z-10">
                        <i data-feather="lock" class="text-slate-400 w-5 h-5 mr-3 group-focus-within:text-cyan-400"></i>
                        <input type="password" id="password" placeholder="Password" required class="bg-transparent border-none outline-none w-full text-white placeholder-slate-500 text-sm font-medium pr-10">
                        <button type="button" id="toggle-password" class="absolute right-4 text-slate-400 hover:text-white">
                            <i data-feather="eye" id="eye-icon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="btn-glow mt-2 w-full bg-gradient-to-r from-blue-700 to-cyan-600 text-white font-semibold py-3.5 rounded-xl flex items-center justify-center gap-2">
                    <span id="btn-text" class="tracking-wide text-sm">LOGIN</span>
                </button>
            </form>
            
            <div class="flex items-center justify-center gap-2 mt-2 opacity-50">
                <i data-feather="shield" class="w-3 h-3 text-cyan-400"></i>
                <span class="text-[10px] tracking-widest text-slate-300 font-mono">HAKMILIK SAINS PD</span>
            </div>
        </div>
    </main>

    <script>
        feather.replace();
        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleBtn.innerHTML = `<i data-feather="${isPassword ? 'eye-off' : 'eye'}" class="w-4 h-4 text-cyan-400"></i>`;
            feather.replace();
        });

        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = passwordInput.value;
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const errorMsg = document.getElementById('error-message');
            const card = document.getElementById('login-card');

            errorMsg.classList.add('hidden');
            card.classList.remove('animate-shake');
            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> AUTHENTICATING...';
            btn.classList.add('opacity-90', 'cursor-not-allowed');

            try {
                const CLOUDFLARE_URL = 'https://sains-api.sainspdwater.workers.dev'; 
                
                const response = await fetch(CLOUDFLARE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', username: username, password: password })
                });
                
                const data = await response.json();

                if (data.success) {
                    btn.classList.add('bg-emerald-600');
                    btnText.innerHTML = '<i data-feather="check" class="inline w-4 h-4 mr-1"></i> ACCESS GRANTED';
                    feather.replace();
                    card.style.boxShadow = '0 0 50px rgba(52, 211, 153, 0.4)';
                    card.style.borderColor = 'rgba(52, 211, 153, 0.5)';

                    // 🟢 SIMPAN TOKEN & MASA LOG MASUK
                    sessionStorage.setItem('sains_token', data.token);
                    sessionStorage.setItem('sains_login_time', Date.now().toString());

                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000); 
                } else {
                    resetBtn();
                    errorMsg.querySelector('span').innerText = data.message;
                    errorMsg.classList.remove('hidden');
                    card.classList.add('animate-shake');
                }
            } catch (error) {
                resetBtn();
                errorMsg.querySelector('span').innerText = "Ralat pelayan / Tiada internet.";
                errorMsg.classList.remove('hidden');
                card.classList.add('animate-shake');
            }

            function resetBtn() {
                btn.disabled = false;
                btnText.innerHTML = 'LOGIN';
                btn.classList.remove('opacity-90', 'cursor-not-allowed', 'bg-emerald-600');
            }
        }
    </script>
</body>
</html>
